; PlatformIO Project Configuration
; For building ESP32 firmware

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor speed
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DWIFI_TIMEOUT=30000

; Only compile the firmware sketch (ignore provision JSON / examples)
build_src_filter = +<smart-feeder.cpp>

; MQTT 3.1.1 client with QoS 2 subscribe (PubSubClient cannot do this).
; ArduinoJson 6.x keeps StaticJsonDocument. ESP32Servo matches original Servo usage
; on the stock espressif32 Arduino 2.x core.
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    bertmelis/espMqttClient@^1.7.0
    madhephaestus/ESP32Servo@1.1.1

; Upload speed
upload_speed = 921600

; Serial port (change as needed)
upload_port = /dev/cu.*

; Monitor port (change as needed)
monitor_port = /dev/cu.*
