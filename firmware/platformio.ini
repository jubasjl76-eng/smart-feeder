; Smart Pet Feeder firmware — built on smart-pet-device-sdk.
;
;   pio run -d firmware            # build for esp32dev
;   wokwi-cli firmware             # run the Wokwi scenario (needs WOKWI_CLI_TOKEN)
;
; The pre-SDK single-file firmware is kept as smart-feeder.legacy.cpp and is not
; compiled (build_src_filter below).

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32 @ ^6.9.0        ; ESP32 Arduino core (matches the SDK)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; two ~1.9 MB app slots so signed A/B OTA has room (default scheme is ~1.3 MB)
board_build.partitions = min_spiffs.csv

build_src_filter = +<main.cpp>
; SDK headers are C++17; core 2.x defaults to gnu++11/14
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DMQTT_MAX_PACKET_SIZE=1024

lib_deps =
    https://github.com/jubasjl76-eng/smart-pet-device-sdk.git#18ad23b7eea5a8b7a65e248427cd52d4d78fb8cd
    bblanchon/ArduinoJson @ ^7.0.0
    madhephaestus/ESP32Servo @ ^3.0.5
