; PlatformIO Project Configuration
; For building ESP32 firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor speed
monitor_speed = 115200

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DWIFI_TIMEOUT=30000

; Upload speed
upload_speed = 921600

; Serial port (change as needed)
upload_port = /dev/cu.*

; Monitor port (change as needed)
monitor_port = /dev/cu.*
