# Wokwi Project Configuration for Smart Feeder
# Build with: pio run -d firmware/

[wokwi]
version = 1
elf = ".pio/build/esp32dev/firmware.elf"
firmware = ".pio/build/esp32dev/firmware.bin"

# ESP32 DevKit V1
[board]
mcu = "esp32"
flash_size = "4MB"

# Simulation timeout (0 = unlimited)
timeout = 0

# Virtual serial monitor
[serial]
enabled = true

[wasm]
enabled = false
